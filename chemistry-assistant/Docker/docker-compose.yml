# 化学助手项目 Docker Compose 配置
# 版本: 3.8

version: '3.8'

services:
  # 化学助手主服务
  chemistry-assistant:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: chemistry-assistant
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      # 基础环境变量
      - PYTHONUNBUFFERED=1
      - KMP_DUPLICATE_LIB_OK=TRUE
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      
      # API密钥配置 (从环境变量文件加载)
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - TONGYI_API_KEY=${TONGYI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - QIANFAN_API_KEY=${QIANFAN_API_KEY}
      - METASO_API_KEY=${METASO_API_KEY}
      - TONGYI_KNOWLEDGE_API_KEY=${TONGYI_KNOWLEDGE_API_KEY}
      - TONGYI_KNOWLEDGE_APP_ID=${TONGYI_KNOWLEDGE_APP_ID}
      
      # 应用配置
      - WEB_PORT=7860
      - LOG_LEVEL=INFO
      - ENABLE_ADAPTIVE=true
      - USE_RERANKER=true
    
    volumes:
      # 数据持久化
      - ./data:/app/data
      - ./logs:/app/logs
      # 配置文件挂载
      - ./config.py:/app/config.py:ro
      # SSL证书挂载 (如果需要)
      - ./ssl:/app/ssl:ro
    
    env_file:
      - .env.docker
    
    networks:
      - chemistry-net
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  # Redis缓存服务 (可选)
  redis:
    image: redis:7-alpine
    container_name: chemistry-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - chemistry-net
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Nginx反向代理 (可选)
  nginx:
    image: nginx:alpine
    container_name: chemistry-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - chemistry-net
    depends_on:
      - chemistry-assistant
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

# 网络配置
networks:
  chemistry-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 数据卷配置
volumes:
  redis-data:
    driver: local
  chemistry-data:
    driver: local
  chemistry-logs:
    driver: local